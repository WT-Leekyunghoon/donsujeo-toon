name: donsujeo-toon

# 하마의 ETF 도전기 자동 게시 — 큐 방식 (컴퓨터 꺼져 있어도 GitHub Actions가 실행)
# KST 09:50 ETF 상식 / 12:00 하마 4컷툰(완성 이미지) / 17:00 ETF 상식  (2026-10-06~ 새 계정)
# GitHub cron 은 지연·누락이 잦아 정각에서 떨어진 분(11·41)에 30분 간격으로
# KST 09:51 + 10~22시(UTC 1~13시) 돌면서 '시각이 지난 미게시 슬롯'을 따라잡는다.
# run_episode.py 가 이미 게시된 슬롯은 건너뛰므로 중복 없음.
on:
  schedule:
    - cron: '51 0 * * *'          # KST 09:51 (첫 글 09:50)
    - cron: '11,41 1-13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: toon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          T: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "THREADS_ACCESS_TOKEN Secret 미설정 — 이번 회차 건너뜀"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        if: env.SKIP != '1'
        run: pip -q install requests

      - name: Git identity
        if: env.SKIP != '1'
        run: |
          git config user.name "donsujeo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run episode
        if: env.SKIP != '1'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/run_episode.py
