name: donsujeo-toon

# 돈수저툰 자동 게시 — 큐 방식 (컴퓨터 꺼져 있어도 GitHub Actions가 실행)
# KST 10:00 툰① / 12:00 팁① / 14:00 뉴스 / 17:00 툰② / 19:00 팁②
# GitHub cron 은 지연·누락이 잦아 슬롯 시각에만 돌리면 회차가 통째로 빠진다.
# KST 10~21시(UTC 1~12시) 매시간 돌면서 '시각이 지난 미게시 슬롯'을 따라잡는다.
# 게시할 게 없으면 run_episode.py 가 그냥 넘어간다.
on:
  schedule:
    - cron: '3 1-12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: toon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          T: ${{ secrets.THREADS_ACCESS_TOKEN }}
          U: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$U" ]; then
            echo "THREADS_ACCESS_TOKEN / THREADS_USER_ID Secret 미설정 — 이번 회차 건너뜀"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (Playwright + 한글 폰트)
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip -q install playwright requests
          python -m playwright install --with-deps chromium

      - name: Git identity
        if: env.SKIP != '1'
        run: |
          git config user.name "donsujeo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run episode
        if: env.SKIP != '1'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/run_episode.py
